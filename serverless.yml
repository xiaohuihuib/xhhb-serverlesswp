service: serverlesswp-wordpress-starter

provider:
  name: aws
  runtime: nodejs24.x
  httpApi:
    payload: '2.0'

package:
  patterns:
    # Exclude large/unnecessary items to keep the bundle size reasonable.
    - '!.git/**'
    - '!.serverless/**'
    - '!test/**'
    - '!wp-public/**'
    - '!wp/wp-content/uploads/**'
    - '!assets/**'
    # Ensure the PHP binary shipped by serverlesswp is included in the bundle.
    # Serverless' dependency analysis may miss files that are only used at runtime by spawn().
    - 'node_modules/serverlesswp/php-files/**'

functions:
  requestHandler:
    handler: api/index.handler
    memorySize: 1024
    timeout: 30
    events:
      - httpApi:
          method: any
          path: /{proxy+}
    environment:
      #DATABASE: ''
      #USERNAME: ''
      #PASSWORD: Don't set this if you'll be commiting the file, instead use the AWS console or another method like Parameter Store
      #HOST: ''
