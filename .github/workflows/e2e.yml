name: e2e Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  routing:
    name: vercel routing
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - run: ./test/run-vercel-routing-test.sh

  jest:
    name: e2e tests
    runs-on: ubuntu-latest
    if: github.repository_owner == 'xiaohuihuib'
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      # Runs before the Docker suites for fast feedback. Needs the root
      # dependencies, not the ones in test/.
      - name: Install root dependencies
        run: npm ci

      - name: router policy unit tests
        run: node --test router-policy.test.js
        working-directory: ./test

      - run: ./run-db-test.sh
        working-directory: ./test
