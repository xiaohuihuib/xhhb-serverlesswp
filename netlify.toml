[functions]
  directory = "api"
  # Netlify's esbuild bundler rewrites __dirname, so the PHP binary that
  # serverlesswp spawns must be included as a static directory at the bundle
  # root (/var/task/php-files). The build command copies it from node_modules.
  included_files = ["wp/**", "php-files/**"]
  node_bundler = "esbuild"
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index/:splat"
  status = 200
  # Let Netlify serve matching static files from the publish directory directly.
  # Only fall through to the function when no static asset exists.
  force = false
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "max-age=864000, s-maxage=864000"
[build]
  command = "rm -rf .git && npm ci && cp -R node_modules/serverlesswp/php-files php-files && mkdir -p wp-public && find wp -type f \\( -name '*.css' -o -name '*.js' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.gif' -o -name '*.svg' -o -name '*.woff' -o -name '*.woff2' -o -name '*.ico' -o -name '*.otf' -o -name '*.webp' \\) -exec cp --parents {} wp-public/ \\;"
  publish = "wp-public/wp"
[build.environment]
  NODE_VERSION = "24"
